# Model registry — the ONLY place model repo IDs live. Code must never hard-code them.
#
# verification:
#   verified            -> confirmed against upstream source/docs in Phase 0
#   needs-user-machine  -> could not be confirmed from the build environment
#                          (huggingface.co was unreachable); run
#                          `python scripts/validate_env.py --check-hf` locally.
#   experimental        -> API verified, but VRAM/licensing/quality not yet proven on 16 GB
#
# license_claim is informational only. ALWAYS read the model card yourself; see MODEL_LICENSES.md.
# `local_path` (optional) overrides `repo_id` for fully offline use.

image:
  default: flux2_klein_4b
  models:
    flux2_klein_4b:
      provider: flux2_diffusers
      pipeline_class: Flux2KleinPipeline
      repo_id: black-forest-labs/FLUX.2-klein-4B
      local_path: null
      distilled: true
      verification: needs-user-machine
      license_claim: "Apache-2.0 (unverified)"
      # Unverified defaults — confirm recommended steps and reference limits on the model card.
      default_steps: 4
      max_reference_images: 4
      max_size: 2048
    flux2_klein_9b:
      provider: flux2_diffusers
      pipeline_class: Flux2KleinPipeline
      repo_id: black-forest-labs/FLUX.2-klein-9B
      local_path: null
      distilled: true
      verification: needs-user-machine
      license_claim: "Non-commercial (unverified)"
      # Unverified defaults — confirm recommended steps and reference limits on the model card.
      default_steps: 4
      max_reference_images: 4
      max_size: 2048
    flux2_klein_base_9b:
      provider: flux2_diffusers
      pipeline_class: Flux2KleinPipeline
      # Repo ID appears in diffusers v0.40.0 pipeline_flux2_klein.py docstring.
      repo_id: black-forest-labs/FLUX.2-klein-base-9B
      local_path: null
      distilled: false
      verification: needs-user-machine
      license_claim: "Non-commercial (unverified)"
      # Unverified defaults — confirm recommended steps and reference limits on the model card.
      default_steps: 50
      max_reference_images: 4
      max_size: 2048
    flux2_dev:
      provider: flux2_diffusers
      pipeline_class: Flux2Pipeline
      # Repo ID appears in diffusers v0.40.0 pipeline_flux2.py docstring.
      repo_id: black-forest-labs/FLUX.2-dev
      local_path: null
      distilled: false
      verification: experimental
      license_claim: "FLUX.2 [dev] Non-Commercial License (unverified)"
      # Unverified defaults — confirm recommended steps and reference limits on the model card.
      default_steps: 50
      max_reference_images: 4
      max_size: 2048
      note: "32B transformer + 24B text encoder; not practical on 16 GB VRAM / 32 GB RAM without quantization."
  inpaint:
    flux2_klein_inpaint:
      provider: flux2_diffusers
      pipeline_class: Flux2KleinInpaintPipeline
      model_ref: flux2_klein_4b
      verification: needs-user-machine

video:
  default: wan22_ti2v_5b
  models:
    wan22_ti2v_5b:
      provider: wan_diffusers
      # Listed in diffusers v0.40.0 docs/api/pipelines/wan.md. The stored pipeline class is read from
      # the repo's model_index.json at load time; T2V and I2V share the weights (from_pipe).
      repo_id: Wan-AI/Wan2.2-TI2V-5B-Diffusers
      local_path: null
      # Wan2.2 README: 720p is 1280x704 / 704x1280 at 24 fps. Frames must be 4k+1 (121 = 5 s).
      fps: [24]
      max_frames: 121
      frame_step: 4
      size_multiple: 32
      max_size: 1280
      default_steps: 50  # needs-user-machine: speed/quality trade-off on your GPU
      default_guidance: 5.0
      text_to_video: true
      last_frame_conditioning: false  # WanImageToVideoPipeline accepts last_image; unverified for TI2V-5B
      verification: needs-user-machine
      license_claim: "Apache-2.0 (unverified)"
      note: "Wan2.2 README: runs on 24 GB with offload; on 16 GB use Balanced/Low VRAM and 480p-704p drafts."
    camera_motion:
      provider: ffmpeg_motion
      verification: verified
      license_claim: "Project code + FFmpeg (no model weights)"
      note: "No AI: smooth push-in/pan/tilt over your image. Keeps product and property photos pixel-true."
    ltx2:
      provider: ltx_diffusers
      pipeline_class: LTX2ImageToVideoPipeline
      # Listed in diffusers v0.40.0 docs/api/pipelines/ltx2.md. Not integrated: it generates audio+video
      # with a large transformer; running it on 16 GB VRAM / 32 GB RAM is not verified.
      repo_id: Lightricks/LTX-2
      local_path: null
      verification: experimental
      license_claim: "LTX-2 community license (unverified; revenue-based terms)"

llm:
  default: ollama_default
  models:
    # Only loopback URLs are accepted: script text and product/property facts never leave the machine.
    ollama_default:
      provider: ollama
      base_url: http://127.0.0.1:11434
      # Ollama model tag; pick any locally pulled model with good Turkish support.
      model: qwen3:8b
      # Qwen3 is a thinking model; `think: false` keeps the JSON answer in `message.content`.
      think: false
      keep_alive: 0  # unload right after each request so FLUX/video get the VRAM
      temperature: 0.4
      verification: verified
      license_claim: "Depends on the chosen model (Qwen3: Apache-2.0, unverified)"
      note: "Ollama API verified from docs/api.md; model quality in Turkish needs-user-machine."
    gemma3_12b:
      provider: ollama
      base_url: http://127.0.0.1:11434
      model: gemma3:12b
      keep_alive: 0
      temperature: 0.4
      verification: needs-user-machine
      license_claim: "Gemma Terms of Use (unverified)"
    llamacpp_local:
      provider: llamacpp_server
      base_url: http://127.0.0.1:8080
      temperature: 0.4
      verification: verified
      license_claim: "llama.cpp MIT; model: per GGUF file"
      note: "Start llama-server yourself with any GGUF model; API verified from tools/server/README.md."

tts:
  default: chatterbox_multilingual
  models:
    chatterbox_multilingual:
      provider: chatterbox
      # Runs in an isolated venv: chatterbox-tts pins torch==2.6.0 (no Blackwell sm_120 support).
      venv_python: null
      languages: [tr, en]
      verification: verified
      license_claim: "MIT (code, verified from repo LICENSE); weights: check model card"
    piper:
      provider: piper
      voice_path: null
      verification: verified
      license_claim: "piper-tts: GPL-3.0-or-later; voices: per-voice license"

lipsync:
  default: latentsync_15
  models:
    latentsync_15:
      provider: latentsync
      # Isolated venv + cloned repo; README states 8 GB min VRAM for v1.5, 18 GB for v1.6.
      repo_dir: null
      venv_python: null
      checkpoint_path: null
      verification: experimental
      license_claim: "Apache-2.0 (code, verified from repo LICENSE)"

asr:
  default: faster_whisper_large_v3
  models:
    faster_whisper_large_v3:
      provider: faster_whisper
      model: large-v3
      compute_type_gpu: float16
      compute_type_cpu: int8
      verification: needs-user-machine
      license_claim: "faster-whisper MIT; Whisper weights MIT (unverified)"

segmentation:
  default: birefnet_general
  models:
    # rembg ONNX sessions (rembg 2.0.85). Weights come from the rembg GitHub releases, not Hugging Face;
    # download with scripts/download_models.py (stored under MODELS_DIR/rembg unless REMBG_HOME/U2NET_HOME is set).
    birefnet_general:
      provider: rembg_onnx
      session: birefnet-general
      verification: verified
      license_claim: "rembg MIT; BiRefNet weights MIT (unverified)"
      note: "Best quality for products; ~1 GB ONNX, 1024x1024 inference."
    birefnet_general_lite:
      provider: rembg_onnx
      session: birefnet-general-lite
      verification: verified
      license_claim: "rembg MIT; BiRefNet weights MIT (unverified)"
      note: "Faster, smaller BiRefNet (Swin-T backbone)."
    isnet_general_use:
      provider: rembg_onnx
      session: isnet-general-use
      verification: verified
      license_claim: "rembg MIT; DIS/ISNet weights Apache-2.0 (unverified)"
    color_key:
      provider: color_key
      tolerance: 24
      verification: verified
      license_claim: "Project code (no model weights)"
      note: "Classical, no AI: removes a plain uniform background connected to the image border."
    birefnet_transformers:
      provider: birefnet
      repo_id: ZhengPeng7/BiRefNet
      # trust_remote_code requires a pinned commit; set after reviewing the repo code.
      revision: null
      verification: needs-user-machine
      license_claim: "MIT (unverified)"
      note: "Not implemented: needs trust_remote_code; the rembg ONNX export above covers BiRefNet."

upscale:
  default: realesrgan_x4
  models:
    realesrgan_x4:
      provider: spandrel
      weights_path: null
      verification: needs-user-machine
      license_claim: "Real-ESRGAN BSD-3-Clause (unverified)"
